name: release verification

# Fork 发布 GitHub Release 时只做构建与测试验证。
# 原 npm 包名 dsh-pocket 属于上游；本 Fork 在有独立 npm 包名、token 和发布策略前，
# 绝不自动 npm publish，也不回写 package.json 版本。

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 构建客户端
        run: npm run build:client
      - name: 测试
        run: npm test
